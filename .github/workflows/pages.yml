# Daily: rebuild site/data from the original sources (BoM RMM, UW LPT) and deploy site/ to Pages.
# No data is committed: downloads and LPT outlines live in the Actions cache between runs.
name: Update data and deploy

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC; BoM usually posts the previous day by then
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write           # keepalive: stops GitHub disabling the schedule after 60 quiet days
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Restore downloads and outlines
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            site/data/outlines
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Build site data
        run: python pipeline/build.py --fetch
      - name: Real LPT outlines (only systems not already cached)
        run: python pipeline/outlines.py --workers 4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: liskin/gh-workflow-keepalive@v1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
