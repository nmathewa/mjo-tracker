# Daily: rebuild site/data from the original sources (BoM RMM, UW LPT) and deploy site/ to Pages.
# No data is committed: downloads, LPT outlines and GEFS fields live in the Actions cache between runs.
# The experimental forecast model is downloaded from a GitHub Release (model-v0.1).
# The page is built with pandoc from content/index.md and the academic-site-template (submodule theme/),
# taken at its latest main on every run, so template changes reach the site on the next build.
name: Update data and deploy

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC; BoM usually posts the previous day by then
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write           # keepalive: stops GitHub disabling the schedule after 60 quiet days
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Latest academic-site-template and pandoc
        run: |
          git submodule update --remote theme
          curl -sfL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i pandoc.deb && rm pandoc.deb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Restore downloads and outlines
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/gefs
            site/data/outlines
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Build site data
        run: python pipeline/build.py --fetch
      - name: Real LPT outlines (only systems not already cached)
        run: python pipeline/outlines.py --workers 4
      - name: Experimental track forecast for one event (model from the model-v0.1 release)
        run: |
          mkdir -p models
          for f in corrector.onnx norm.npz meta.json; do
            curl -sfL -o models/$f https://github.com/nmathewa/mjo-tracker/releases/download/model-v0.1/$f
          done
          python pipeline/forecast.py --model models
      - name: Build the page from Markdown (content/) with the template
        run: make
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: liskin/gh-workflow-keepalive@v1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
